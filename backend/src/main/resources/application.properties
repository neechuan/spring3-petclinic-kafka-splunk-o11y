spring.application.name=petclinic-backend
server.port=8081

# ---------------------------------------------------------------------------
# HSQLDB in-memory database (seeded on startup from schema.sql + data.sql)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:hsqldb:mem:petclinic
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.HSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# SQL initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath*:db/hsqldb/schema.sql
spring.sql.init.data-locations=classpath*:db/hsqldb/data.sql

# JSON: Jackson 2 (Spring Boot 3) serializes java.time values as ISO strings by
# default; just tolerate unknown fields on the wire.
spring.jackson.deserialization.fail-on-unknown-properties=false

# ---------------------------------------------------------------------------
# Kafka connection
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.consumer.group-id=petclinic-backend
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

management.endpoints.web.exposure.include=*

logging.level.org.springframework=INFO
