spring.application.name=petclinic-backend
server.port=8081

# ---------------------------------------------------------------------------
# HSQLDB in-memory database (seeded on startup from schema.sql + data.sql)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:hsqldb:mem:petclinic
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.HSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# SQL initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath*:db/hsqldb/schema.sql
spring.sql.init.data-locations=classpath*:db/hsqldb/data.sql

# JSON: Jackson 2 (Spring Boot 3) serializes java.time values as ISO strings by
# default; just tolerate unknown fields on the wire.
spring.jackson.deserialization.fail-on-unknown-properties=false

# ---------------------------------------------------------------------------
# TIBCO EMS/JMS connection (ActiveMQ)
# ---------------------------------------------------------------------------
spring.activemq.broker-url=tcp://localhost:61616
# Enable pooling for JMS
spring.activemq.pool.enabled=true
spring.activemq.pool.max-connections=10

management.endpoints.web.exposure.include=*

logging.level.org.springframework=INFO
