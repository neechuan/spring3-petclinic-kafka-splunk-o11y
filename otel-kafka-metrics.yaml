receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  kafka_metrics:
    brokers: petclinic-kafka:9092
    protocol_version: 2.0.0
    cluster_alias: petclinic-kafka
    scrapers:
      - brokers
      - topics
      - consumers
    collection_interval: 1m
    # Give the broker time to finish startup before the first scrape.
    initial_delay: 45s
    # Exclude internal Kafka topics (those starting with _)
    topic_match: ^[^_].*$
    # Match all consumer groups
    group_match: .*
    # Kafka is running with PLAINTEXT auth, no auth section needed
    metrics:
      # Enable core metrics (most are enabled by default)
      kafka.brokers:
        enabled: true
      kafka.consumer_group.lag:
        enabled: true
      kafka.consumer_group.lag_sum:
        enabled: true
      kafka.consumer_group.members:
        enabled: true
      kafka.consumer_group.offset:
        enabled: true
      kafka.consumer_group.offset_sum:
        enabled: true
      kafka.partition.current_offset:
        enabled: true
      kafka.partition.oldest_offset:
        enabled: true
      kafka.partition.replicas:
        enabled: true
      kafka.partition.replicas_in_sync:
        enabled: true
      kafka.topic.partitions:
        enabled: true
      # Disable optional metrics (log retention, replication factor, min_insync_replicas)
      kafka.broker.log_retention_period:
        enabled: false
      kafka.topic.log_retention_period:
        enabled: false
      kafka.topic.log_retention_size:
        enabled: false
      kafka.topic.min_insync_replicas:
        enabled: false
      kafka.topic.replication_factor:
        enabled: false
    resource_attributes:
      kafka.cluster.alias:
        enabled: true

exporters:
  # otlphttp sends APM traces to Splunk Observability Cloud via native OTLP protocol
  otlp_http/traces:
    traces_endpoint: https://ingest.${SPLUNK_REALM}.signalfx.com/v2/trace/otlp
    headers:
      X-SF-Token: ${SPLUNK_ACCESS_TOKEN}

  otlp_http/metrics:
    metrics_endpoint: https://ingest.${SPLUNK_REALM}.observability.splunkcloud.com/v2/datapoint/otlp
    headers:
      X-SF-Token: ${SPLUNK_ACCESS_TOKEN}

  # signalfx handles metrics + service-to-host correlation (not trace data)
  #signalfx:
  #  access_token: ${SPLUNK_ACCESS_TOKEN}
  #  realm: ${SPLUNK_REALM}
  
  debug:
    verbosity: detailed

processors:
  batch:
    send_batch_size: 1024
    timeout: 5s
  attributes:
    actions:
      - key: deployment.environment
        value: lab
        action: insert
      - key: service.version
        value: 1.0
        action: insert

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes, batch]
      #exporters: [debug, otlp_http/traces]  # otlphttp=APM traces
      exporters: [otlp_http/traces]  # otlphttp=APM traces

    metrics:
      receivers: [otlp, kafka_metrics]
      processors: [attributes, batch]
      exporters: [debug, otlp_http/metrics]  # otlphttp=metrics

