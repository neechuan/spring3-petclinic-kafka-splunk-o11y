spring.application.name=petclinic-frontend
server.port=8080

# Web / view layer
spring.thymeleaf.mode=HTML
spring.messages.basename=messages/messages
spring.web.resources.cache.cachecontrol.max-age=12h

# JSON: Jackson 2 (Spring Boot 3) serializes java.time values as ISO strings by
# default; just tolerate unknown fields on the wire.
spring.jackson.deserialization.fail-on-unknown-properties=false

# ---------------------------------------------------------------------------
# Kafka connection and request/reply timeout
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
kafka.request.timeout-ms=10000

# Actuator (development convenience)
management.endpoints.web.exposure.include=*

logging.level.org.springframework=INFO
