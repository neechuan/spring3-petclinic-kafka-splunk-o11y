spring.application.name=petclinic-frontend
server.port=8080

# Web / view layer
spring.thymeleaf.mode=HTML
spring.messages.basename=messages/messages
spring.web.resources.cache.cachecontrol.max-age=12h

# JSON: Jackson 2 (Spring Boot 3) serializes java.time values as ISO strings by
# default; just tolerate unknown fields on the wire.
spring.jackson.deserialization.fail-on-unknown-properties=false

# ---------------------------------------------------------------------------
# TIBCO EMS/JMS connection and request/reply timeout (ActiveMQ)
# ---------------------------------------------------------------------------
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.pool.enabled=true
spring.activemq.pool.max-connections=10
tibco.request.timeout-ms=10000

# Actuator (development convenience)
management.endpoints.web.exposure.include=*

logging.level.org.springframework=INFO
